          <!-- Recipient section -->

              <!-- Amount input -->

              >

              <!-- USD equivalent -->

                    $0.00

            <!-- Token balance -->

              <div class="token-balance-left">

              <!-- Max amount button -->

            <!-- Numeric keypad -->

              <button type="button">1</button>

              <button type="button">8</button>
              <button type="button">9</button>

              <button type="button">.</button>
              <button type="button">0</button>

              <button
                type="button"
                aria-label="Delete"
              >
                ⌫
              </button>

            </div>





            <!--
              Numeric keypad JavaScript.

              This is the same inline JavaScript from the
              supplied code, only formatted for readability.
            -->
           <script>
const keypadButtons = document.querySelectorAll(".numeric-keypad button");
const amountInput = document.querySelector(".amount-number");
const e = document.querySelector(".token-balance-name");
const u = document.querySelector(".token-balance-usd");

amountInput.addEventListener("input", () => {
  const t = amountInput.value || "0";
  e.textContent = `${t} USDT`;

  const n = parseFloat(t);

  u.textContent =
    !isNaN(n) && n > 0
      ? `$${n.toFixed(2)}`
      : "$0.00";
});

keypadButtons.forEach(t => {
  t.addEventListener("click", () => {
    const n = t.textContent.trim();

    "⌫" === n
      ? amountInput.value =
          amountInput.value.length > 1
            ? amountInput.value.slice(0, -1)
            : "0"

      : "." === n
        ? "0" === amountInput.value
          ? amountInput.value = "0."
          : amountInput.value.includes(".")
            || (amountInput.value += ".")

        : "0" === amountInput.value
          ? amountInput.value = n
          : amountInput.value += n;

    amountInput.dispatchEvent(
      new Event("input", {
        bubbles: true
      })
    );

    amountInput.classList.remove("zero-state");
  });
});
</script>
